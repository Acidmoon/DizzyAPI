# DizzyAPI · cordis 插件树
#
# 这是「什么在运行」的定义（AGENTS.md D1）。
# 每个 entry 的 id 是它在树里的稳定身份；禁用即置 disabled: true，
# 删除即卸载——模块注册的一切都应随 effect 一起回收（AGENTS.md D5）。
#
# 注意：本文件属于 cordis 侧，Go 侧不得改写它（AGENTS.md D8）。

- id: timer
  name: '@cordisjs/plugin-timer'

- id: development
  label: Development
  name: '@cordisjs/plugin-group'
  config:
    - id: hmr
      name: '@cordisjs/plugin-hmr'
      config:
        root:
          - app.yml
          - packages

# 用户插件：用户表单（用户名 / 用户 ID / 状态 / 余额）的唯一写者。
# 它不进 LLM 请求链路，属于控制面；被禁用时它的服务与存储一起回收（D5）。
- id: user
  name: '@dizzyapi/plugin-user'
  config:
    # 相对路径按 cordis 的 baseUrl 解析——注意 include 会把 baseUrl 改成**本文件所在的目录**，
    # 而本文件在仓库根，所以这里就等于 ./data/。把本文件挪到别处，这些路径会跟着挪。
    # /data 已在 .gitignore 里。
    dataPath: ./data/users.json
    # 「指定插件」：只有列在这里的插件可以创建 / 禁用 / 删除用户、改用户名。
    # admin 是开发者控制面板；auth 是鉴权插件——注册的最后一步要建用户。
    adminPlugins:
      - '@dizzyapi/plugin-admin'
      - '@dizzyapi/plugin-auth'

# 外部通讯模块：把验证码之类的消息发出去。
# 现在只做邮件。transport 为 log 时只把消息写进日志（含验证码），仅限开发环境；
# 上生产改成 smtp，并配好 smtp.host / port / secure 与 from。
- id: mailer
  name: '@dizzyapi/plugin-mailer'
  config:
    transport: log
    from: no-reply@dizzyapi.local
    heloDomain: dizzyapi.local
    # SMTP 的配置不必写死在这里：设置插件可以在运行期改上面这些字段
    # （credentials.set 放授权码，再 settings.update 指向它），改完软重启即生效。
    # 真要写进本文件的话是这样：
    # transport: smtp
    # heloDomain: dizzyapi.local
    # smtp:
    #   host: smtp.example.com
    #   port: 587
    #   secure: false          # 587 = 连上后 STARTTLS；465 = secure: true
    #   user: robot@example.com
    #   passRef: dizzyapi/smtp-163   # 授权码放在 credentials 插件里，本文件只留引用名
    #   # 另两种：passEnv: DIZZYAPI_SMTP_PASS（环境变量）/ pass: 明文（不建议）。
    #   # 三者互斥，最多给一个。

# 鉴权插件：注册（邮箱验证码）、登录（密码）、会话签发与校验。
# 界面请求的身份来自它；LLM 请求的身份来自 API key，不经过这里。
- id: auth
  name: '@dizzyapi/plugin-auth'
  config:
    dataPath: ./data/auth.json
    # 必须与 user.adminPlugins 里的名字一致，否则注册会在建用户那一步被拒绝
    userActor: '@dizzyapi/plugin-auth'
    codeTtlMs: 600000          # 验证码 10 分钟有效
    sessionTtlMs: 604800000    # 会话 7 天
    loginMaxFailures: 10       # 15 分钟内连续失败 10 次即暂时拒绝登录

# 凭据插件：秘密（授权码、API key 之类）的唯一存放处，别的插件只留引用名。
# 文件以 0600 落盘；对外只回答「配没配」，永不回显值。
- id: credentials
  name: '@dizzyapi/plugin-credentials'
  config:
    dataPath: ./data/credentials.json

# 账号保管插件：上游账号（订阅 OAuth / 外部 API-key）的唯一写者，也是唯一用 RT 换新令牌的地方。
# 账号记录在 ./data/accounts.json，令牌在 credentials 的 identity/<账号 id> 引用下。
# 它不转发模型请求，不参与描述符；transport 就绪后通过进程内 getAccessToken 取用。
- id: identity
  name: '@dizzyapi/plugin-identity'
  config:
    dataPath: ./data/accounts.json

# 账号管理门面：管理员导入 / 新建 / 修改 / 停用 / 删除上游账号。
# 它自己不存任何数据：账号记录与令牌刷新由 identity 独占写入，秘密由 credentials 独占
# （AGENTS.md D8）。写操作只对 adminPlugins 里的插件开放，默认拒绝；当前入口是开发者面板，
# 面向用户站 / 管理台的 HTTP 路由尚未实现（届时把认证后的管理员映射成白名单 actor）。
# 必须排在 identity 之后：它 inject identity，依赖不满足时不会构造。
- id: account-admin
  name: '@dizzyapi/plugin-account-admin'
  config:
    adminPlugins:
      - '@dizzyapi/plugin-admin'
    maxBatchSize: 100

# 账号请求优先级：策略组的唯一写者 + gatewayd 的监管者。
# 打分与排序发生在 Go 侧（modules/accountpriority）；本插件只持有策略、拉起进程、
# 经控制桥推送策略与 identity 的只读账号快照，并提供预览/选择查询。
# 它不在 LLM 请求热路径上。binaryPath 由 pnpm build:go 产出（bin/ 已 gitignore）。
#
# LLM 请求入口只绑回环地址；静态 API key 从环境变量 DIZZYAPI_API_KEYS 读取
# （逗号/空白分隔）。不设置时 key-auth 处于占位模式：接受任何非空 Bearer key，
# 生产前必须换成 Go 的 auth 模块（AGENTS.md §5）。
- id: account-priority
  name: '@dizzyapi/plugin-account-priority'
  config:
    dataPath: ./data/account-priority.json
    binaryPath: ./bin/gatewayd
    autoStart: true
    httpListen: 127.0.0.1:8080
    # 只有在这里配了地址的 provider 才会被推给 Go；默认已含 openai。
    # custom 需要显式配置，例如：
    #   custom: https://your-upstream.example.com/v1
    upstreamBaseUrls:
      openai: https://api.openai.com/v1

# 插件能力目录：只读观察窗，汇总已装载插件提供什么、接受什么。
# 它从活的插件树反射（服务 / 方法 / inject / 配置 schema），事件、桥命令、数据形状
# 与存储用途由各插件可选的 static catalog 清单补齐；没有清单的面标 unknown。
# 不起 HTTP、不写任何状态、永远不返回秘密。查询走进程内 catalog 服务。
- id: catalog
  name: '@dizzyapi/plugin-catalog'
  config:
    includeUnavailable: true

# 设置插件：运行期可以改的配置由它管（本文件是「人写的基线」，它只覆盖，从不回写本文件）。
# 必须排在它要管的目标后面：启动重放时它才看得见那些 entry。
- id: settings
  name: '@dizzyapi/plugin-settings'
  config:
    dataPath: ./data/settings.json
    # 「指定插件」：只有列在这里的插件可以改配置。
    adminPlugins:
      - '@dizzyapi/plugin-admin'

# 开发者控制面板：看插件与服务的依赖图、看运行期概览、改设置、重启单个插件、退出整个进程。
# 只绑 127.0.0.1；启动日志里会打印一条带一次性 token 的地址，打开后换成 HttpOnly cookie。
# 必须排在 settings 之后——它要在运行期解析 settings 服务（但不 inject 它，
# 否则改任何配置导致的设置插件重载都会把面板一起抖一下）。
- id: admin
  name: '@dizzyapi/plugin-admin'
  config:
    port: 7788

