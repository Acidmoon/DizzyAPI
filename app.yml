# DizzyAPI · cordis 插件树
#
# 这是「什么在运行」的定义（AGENTS.md D1）。
# 每个 entry 的 id 是它在树里的稳定身份；禁用即置 disabled: true，
# 删除即卸载——模块注册的一切都应随 effect 一起回收（AGENTS.md D5）。
#
# 注意：本文件属于 cordis 侧，Go 侧不得改写它（AGENTS.md D8）。

- id: timer
  name: '@cordisjs/plugin-timer'

- id: development
  label: Development
  name: '@cordisjs/plugin-group'
  config:
    - id: hmr
      name: '@cordisjs/plugin-hmr'
      config:
        root:
          - app.yml
          - packages

# 用户插件：用户表单（用户名 / 用户 ID / 状态 / 余额）的唯一写者。
# 它不进 LLM 请求链路，属于控制面；被禁用时它的服务与存储一起回收（D5）。
- id: user
  name: '@dizzyapi/plugin-user'
  config:
    # 相对路径按 cordis 的 baseUrl 解析——注意 include 会把 baseUrl 改成**本文件所在的目录**，
    # 而本文件在仓库根，所以这里就等于 ./data/。把本文件挪到别处，这些路径会跟着挪。
    # /data 已在 .gitignore 里。存储是 SQLite：首次建库时若同目录还有旧的 users.json，
    # 会一次性导入并保留旧文件。
    dataPath: ./data/users.db
    # 「指定插件」：只有列在这里的插件可以创建 / 禁用 / 删除用户、改用户名。
    # admin 是开发者控制面板；auth 是鉴权插件——注册的最后一步要建用户。
    adminPlugins:
      - '@dizzyapi/plugin-admin'
      - '@dizzyapi/plugin-auth'
      - '@dizzyapi/plugin-api'
      - '@dizzyapi/plugin-web'
    # 余额写入白名单：结算扣费（billing）、充值到账（topup）、兑换码加额（redeem）、
    # 管理员改余额（api / web）是仅有的合法写者。不配 = 任何插件都能改余额；
    # 配了就把范围收窄到这几个人。读取始终不限。
    balanceWriters:
      - '@dizzyapi/plugin-billing'
      - '@dizzyapi/plugin-topup'
      - '@dizzyapi/plugin-redeem'
      - '@dizzyapi/plugin-api'
      - '@dizzyapi/plugin-web'

# 余额只读快照推送（服务名 quota）：把 user 的全量余额周期推给 Go 的额度闸门
# （桥命令 quota.replace），余额变更后 debounce 补推。它自己不存数据、不做判断，
# 也不拥有控制桥（桥在 account-priority 里）；Go 侧按自己的 TTL 让快照自然过期，
# 所以禁用本插件不会让闸门永远停在旧余额上。
# inject user + accountPriority + timer：缺任何一个即停在 PENDING。
# pollIntervalMs 决定推得快慢；Go 侧 -quota-snapshot-ttl-ms 建议 ≥ 3 × 本值。
- id: quota
  name: '@dizzyapi/plugin-quota'
  config:
    enabled: true
    pollIntervalMs: 5000       # 5 秒一轮全量推送
    debounceMs: 1000           # 余额变更后最多等 1 秒再推

# 结算插件：真实扣费的唯一执行者（服务名 billing）。
# usage 每拉到一轮用量，先调 billing.settle(records) 再落统计、推进游标：本插件按 req_id
# 幂等（CAS pending → settling → settled），用 pricing 的价格复算整数微元，再经
# user.adjustBalance 扣款（余额允许为负 = 后付费）。价格事实归 pricing、钱归 user，
# 本插件只提交增量；账本 data/billing.db 只有本插件写。
# 它 inject user + pricing：缺任一个即停在 PENDING（fail-closed，不拿 0 价记账）。
# 禁用即关闭账本连接：扣费暂停，用量照常落库（usage 不 inject 本插件）。
# 上面 user.balanceWriters 必须含本插件名，否则扣费会被 user 明确拒绝（落 failed）。
- id: billing
  name: '@dizzyapi/plugin-billing'
  config:
    dataPath: ./data/billing.db
    adminPlugins:
      - '@dizzyapi/plugin-admin'
      - '@dizzyapi/plugin-api'
      - '@dizzyapi/plugin-web'
      # 运维总览要读结算汇总与各状态计数（只读，具体金额仍只在管理面）。
      - '@dizzyapi/plugin-observability'

# 充值订单插件：订单的唯一写者（服务名 topup），存储 data/topup.db。
# 状态机 pending → paid / canceled / expired；到账只经 user.adjustBalance（幂等靠
# pending → paid 的 CAS：重复确认 / 并发确认只加一次钱，失败会退回 pending 可重试）。
# **本批没有在线支付**：只留 PaymentProvider 接口，唯一实现是 manual（线下转账 + 管理员
# 人工确认到账）；不挂任何支付回调路由（没有验签的回调 = 把加余额暴露到公网）。
# 它 inject user；user.balanceWriters 必须含 '@dizzyapi/plugin-topup'。
# 禁用即关库 + 停过期清扫定时器：用户 / 管理面路由由 api / web 运行期解析，缺席即 503。
- id: topup
  name: '@dizzyapi/plugin-topup'
  config:
    dataPath: ./data/topup.db
    provider: manual
    expiresMinutes: 30
    minAmountYuan: 1
    maxAmountYuan: 10000
    adminPlugins:
      - '@dizzyapi/plugin-admin'
      - '@dizzyapi/plugin-api'
      - '@dizzyapi/plugin-web'

# 兑换码插件：批次与兑换码的唯一写者（生成 / 启停 / 删除 / 兑换状态流转）。
# 存储是 SQLite（Node 24 内置 node:sqlite），只落 sha256 哈希与末 4 位掩码，
# 明文只在生成批次的那一次响应里出现。加余额只经 user.adjustBalance(...)——user 是
# 余额唯一写者；兑换用 `enabled → redeeming` 的条件更新保证同一码只成功一次。
# 读也不放行 adminPlugins 之外：api 与 web 是仅有的调用方（管理台动作以它们的名义执行）。
- id: redeem
  name: '@dizzyapi/plugin-redeem'
  config:
    dataPath: ./data/redeem.db
    adminPlugins:
      - '@dizzyapi/plugin-admin'
      - '@dizzyapi/plugin-api'
      - '@dizzyapi/plugin-web'

# API key 插件：用户 API key 的唯一写者（签发 / 改名 / 启停 / 轮换 / 删除）。
# 存储是 SQLite（Node 24 内置 node:sqlite），只落 sha256 哈希与掩码，永不落明文；
# 完整 key 只在创建 / 轮换时返回一次。它 inject user：key 必须属于一个存在的用户。
# Go 的 key-auth 用 account-priority 经控制桥推过去的只读哈希快照校验 key，
# 不读这个文件（AGENTS.md §4.1 / §7.1）。
- id: api-key
  name: '@dizzyapi/plugin-api-key'
  config:
    dataPath: ./data/api-keys.db
    maxKeysPerUser: 100

# 外部通讯模块：把验证码之类的消息发出去。
# 现在只做邮件。transport 为 log 时只把消息写进日志（含验证码），仅限开发环境；
# 上生产改成 smtp，并配好 smtp.host / port / secure 与 from。
- id: mailer
  name: '@dizzyapi/plugin-mailer'
  config:
    transport: log
    from: no-reply@dizzyapi.local
    heloDomain: dizzyapi.local
    # SMTP 的配置不必写死在这里：设置插件可以在运行期改上面这些字段
    # （credentials.set 放授权码，再 settings.update 指向它），改完软重启即生效。
    # 真要写进本文件的话是这样：
    # transport: smtp
    # heloDomain: dizzyapi.local
    # smtp:
    #   host: smtp.example.com
    #   port: 587
    #   secure: false          # 587 = 连上后 STARTTLS；465 = secure: true
    #   user: robot@example.com
    #   passRef: dizzyapi/smtp-163   # 授权码放在 credentials 插件里，本文件只留引用名
    #   # 另两种：passEnv: DIZZYAPI_SMTP_PASS（环境变量）/ pass: 明文（不建议）。
    #   # 三者互斥，最多给一个。

# 鉴权插件：注册（邮箱验证码）、登录（密码）、会话签发与校验。
# 界面请求的身份来自它；LLM 请求的身份来自 API key，不经过这里。
- id: auth
  name: '@dizzyapi/plugin-auth'
  config:
    # SQLite；首次建库时若同目录还有旧的 auth.json，会一次性导入并保留旧文件。
    dataPath: ./data/auth.db
    # 必须与 user.adminPlugins 里的名字一致，否则注册会在建用户那一步被拒绝
    userActor: '@dizzyapi/plugin-auth'
    codeTtlMs: 600000          # 验证码 10 分钟有效
    sessionTtlMs: 604800000    # 会话 7 天
    loginMaxFailures: 10       # 15 分钟内连续失败 10 次即暂时拒绝登录

# 凭据插件：秘密（授权码、API key 之类）的唯一存放处，别的插件只留引用名。
# 文件以 0600 落盘；对外只回答「配没配」，永不回显值。
- id: credentials
  name: '@dizzyapi/plugin-credentials'
  config:
    dataPath: ./data/credentials.json

# 账号保管插件：上游账号（订阅 OAuth / 外部 API-key）的唯一写者，也是唯一用 RT 换新令牌的地方。
# 账号记录在 ./data/accounts.json，令牌在 credentials 的 identity/<账号 id> 引用下。
# 它不转发模型请求，不参与描述符；transport 就绪后通过进程内 getAccessToken 取用。
- id: identity
  name: '@dizzyapi/plugin-identity'
  config:
    dataPath: ./data/accounts.json

# 账号管理门面：管理员导入 / 新建 / 修改 / 停用 / 删除上游账号。
# 它自己不存任何数据：账号记录与令牌刷新由 identity 独占写入，秘密由 credentials 独占
# （AGENTS.md D8）。写操作只对 adminPlugins 里的插件开放，默认拒绝；入口是 api 插件的
# /api/accounts（要求管理员会话，以 API_ACTOR 身份调用），以及开发者面板。
# 必须排在 identity 之后：它 inject identity，依赖不满足时不会构造。
- id: account-admin
  name: '@dizzyapi/plugin-account-admin'
  config:
    adminPlugins:
      - '@dizzyapi/plugin-admin'
      - '@dizzyapi/plugin-api'
      - '@dizzyapi/plugin-web'
      # 健康检查要经门面写状态（setHealth / autoDisable / autoEnable）。
      - '@dizzyapi/plugin-account-health'
    maxBatchSize: 100

# 账号健康检查：定时对可参与调度的账号做连通性测试，连续失败自动停用、一次成功即恢复。
# 它自己不存任何数据：读列表、写状态全部走 account-admin 门面（账号记录仍由 identity 独占写）。
# 后台任务只有定时器（ctx.setInterval 挂在 effect 上，随插件卸载回收），禁用即停；
# 没有 HTTP 路由与桥命令。
# adminPlugins 是「允许手动触发一轮检查」的白名单（runOnce），不挂 HTTP。
- id: account-health
  name: '@dizzyapi/plugin-account-health'
  config:
    enabled: true
    intervalMs: 60000          # 60 秒一轮：自用场景够用，也不会把上游打成压力测试
    failureThreshold: 3        # 连续失败 3 次才自动停用，避免上游抖动误禁
    recoverySuccesses: 1       # 一次成功即恢复
    maxConcurrent: 4
    adminPlugins:
      - '@dizzyapi/plugin-admin'
      - '@dizzyapi/plugin-api'
      - '@dizzyapi/plugin-web'

# 账号请求优先级：策略组的唯一写者 + gatewayd 的监管者。
# 打分与排序发生在 Go 侧（modules/accountpriority）；本插件只持有策略、拉起进程、
# 经控制桥推送策略与 identity 的只读账号快照，并提供预览/选择查询。
# 它不在 LLM 请求热路径上。binaryPath 由 pnpm build:go 产出（bin/ 已 gitignore）。
#
# LLM 请求入口只绑回环地址。API key 有两种来源：生产路径是 api-key 插件经本插件把
# 只读哈希快照推给 Go。Go 一旦收到过快照（包括合法的空快照）就只认快照、永不回退：
# 空快照意味着拒绝全部 key（fail-closed）。只有在「尚未收到任何快照」的启动窗口里，
# 才用环境变量 DIZZYAPI_API_KEYS（逗号/空白分隔），再没有就是接受任何非空 Bearer 的
# 占位模式。api-key 运行期被禁用/卸载时会推空快照撤销已发出的 key；启动时就禁用则
# 不推，保留这条环境变量/占位路径。生产前不要把占位模式当成鉴权（AGENTS.md §4.3 / §11）。
- id: account-priority
  name: '@dizzyapi/plugin-account-priority'
  config:
    dataPath: ./data/account-priority.json
    binaryPath: ./bin/gatewayd
    autoStart: true
    httpListen: 127.0.0.1:8080
    # 只有在这里配了地址的 provider 才会被推给 Go；默认已含 openai。
    # custom 需要显式配置，例如：
    #   custom: https://your-upstream.example.com/v1
    upstreamBaseUrls:
      openai: https://api.openai.com/v1

# 模型价格表：管理员维护的「每百万 token 单价」（元，十进制字符串）。
# 用量插件在读取时按它把 token 换算成费用；本插件不参与 LLM 请求链路，也不碰余额。
# 价格表文件只有本插件写；别的插件只经 pricing 服务读。价格为空的模型按 0 计。
- id: pricing
  name: '@dizzyapi/plugin-pricing'
  config:
    dataPath: ./data/pricing.json
    adminPlugins:
      - '@dizzyapi/plugin-api'
      - '@dizzyapi/plugin-web'

# 模型广场：**纯只读聚合**，不落盘、不写任何数据。
# 它把「价格表（pricing）」+「账号声明的 models / modelMap（accountAdmin 门面）」
# + 「账号的协议 / 健康度 / 凭据状态」拼成一份「我们卖什么」：
#   - /api/models 给前端与脚本（available / unavailable + 不可用原因）；
#   - /console/models 是用户可见的模型广场页。
# 不 inject 任何服务：pricing / accountAdmin 都在运行期解析，它们被禁用时目录降级
# （没有价格 / 没有覆盖度），而不是整个插件 PENDING（D5）。
# **不暴露任何秘密**：只输出对外模型名、计数与协议名；账号 id / label / baseUrl 都不出。
- id: modelhub
  name: '@dizzyapi/plugin-modelhub'
  config:
    # 没有精确价格的模型也列出来（用户想知道自己能调什么）。
    includeUnpriced: true

# 用量明细：接收 Go 经控制桥送来的请求用量（轮询 `usage.since`），落 SQLite。
# 只存 token 事实，不存费用；费用由读取方按 pricing 的当前价格表计算。
# 一轮的顺序是「拉取 → 落库 → 结算（billing）→ 推进游标」；结算失败不推进游标。
# 落库失败的坏记录过了阈值会进 `usage_rejected` 隔离表，由管理面人工忽略 / 重放。
# 不 inject account-priority / pricing / billing：它们被禁用时历史查询仍然可用（D5）。
- id: usage
  name: '@dizzyapi/plugin-usage'
  config:
    dataPath: ./data/usage.db
    retentionDays: 90
    # 1s 一轮：Go 缓冲默认 32768 条，正常流量离回绕很远；结算挂在这一轮里，别调太大。
    pollIntervalMs: 1000
    maxBatch: 500
    # 同一条坏记录连续失败多少轮后隔离（1..1000）。低于阈值整批回滚、游标不动。
    rejectAfterFailures: 10

# 插件能力目录：只读观察窗，汇总已装载插件提供什么、接受什么。
# 它从活的插件树反射（服务 / 方法 / inject / 配置 schema），事件、桥命令、数据形状
# 与存储用途由各插件可选的 static catalog 清单补齐；没有清单的面标 unknown。
# 不起 HTTP、不写任何状态、永远不返回秘密。查询走进程内 catalog 服务。
- id: catalog
  name: '@dizzyapi/plugin-catalog'
  config:
    includeUnavailable: true

# 前端宿主：SPA 静态资源的版本化安装、原子切换与回滚，以及页面 / 设置卡 / 插槽清单。
# 它不监听 HTTP：manifest.json 与版本目录由未来的 Go httpapi 或反向代理直接读盘发出去。
# 开发时用 `pnpm preview:console` 看 mock 数据的预览（只绑 127.0.0.1，不经过这个 entry）。
- id: frontend
  name: '@dizzyapi/plugin-frontend'
  # 旧 SPA 已由 `web`（服务端渲染，一页一文件）取代；宿主暂时保留，禁用后页面清单与
  # 静态资源版本管理都不再运行，`/assets/frontend/*` 与 SPA 路由会 404。
  disabled: true
  config:
    dataPath: ./data/frontend
    publicBase: /assets/frontend
    apiBase: /api
    mode: rest

# 页面模板：从 deepseek-usage 抽出的像素级外壳、卡片、过滤行、图表与设计 token。
# 它是纯服务（pageTemplate）：不起 HTTP、不读写存储、不依赖别的插件；
# 页面插件经服务拿同一套 DOM 与样式，避免每个新页面重抄一遍视觉规格。
- id: page-template
  name: '@dizzyapi/plugin-page-template'

# 站点字体：自托管 Smiley Sans（得意黑）v2.0.1，SIL OFL-1.1。
# 纯资源服务：web 把它的 @font-face 追加进 /assets/app.css，并从
# /assets/fonts/smiley-sans.woff2 发字体字节；scope 决定只换标题还是全站。
- id: font-smiley
  name: '@dizzyapi/plugin-font-smiley'
  config:
    scope: all

# 服务端渲染前端：一页一个文件（packages/web/src/pages），数据走进程内服务。
# 写操作是表单 POST + 303；样式与脚本由 /assets/app.* 外链，CSP 保持 'self'。
- id: web
  name: '@dizzyapi/plugin-web'
  config:
    port: 7792
    sessionCookieName: dizzyapi_session

# 「用量信息」页：DeepSeek 开放平台用量页的像素级复刻，独立成页，不改 packages/console 的控制台。
# 页面模板已抽成 page-template 插件；本插件保留为像素级参考，默认禁用（web 已接管 /console/usage）。
- id: deepseek-usage
  name: '@dizzyapi/plugin-deepseek-usage'
  disabled: true
  config:
    port: 7793
    basePath: /console/usage
    enabled: true
    sessionCookieName: dizzyapi_session

# 产品 HTTP 入口：同源提供 SPA 静态资源与 /api/*（界面请求）。
# 静态字节从 frontend 的版本目录读盘；/api/* 在进程内调用控制面服务，不走控制桥。
# 只绑 127.0.0.1；会话只进 HttpOnly cookie，API key 的完整值只在创建 / 轮换时出现一次。
# 它只 inject user / auth / loader；frontend / catalog / accountAdmin 等运行期解析，
# 缺谁只让对应路由 503，入口本身不会 PENDING。排在 frontend 之后只是为了让启动顺序直观。
- id: api
  name: '@dizzyapi/plugin-api'
  config:
    port: 7791

# 设置插件：运行期可以改的配置由它管（本文件是「人写的基线」，它只覆盖，从不回写本文件）。
# 必须排在它要管的目标后面：启动重放时它才看得见那些 entry。
- id: settings
  name: '@dizzyapi/plugin-settings'
  config:
    dataPath: ./data/settings.json
    # 「指定插件」：只有列在这里的插件可以改配置。
    adminPlugins:
      - '@dizzyapi/plugin-admin'
      - '@dizzyapi/plugin-api'
      - '@dizzyapi/plugin-web'

# 审计插件：管理员高危写操作的**唯一记录者**（服务名 audit，存储 data/audit.db）。
# 记的是「谁（人类管理员 / 系统）、经哪个插件、对谁、做了什么、结果如何」，落库前统一脱敏
# （键名 + 值形状两道闸）；**秘密不进审计表**。它是旁路：业务写操作在自己成功后调
# audit.record(...)，审计挂了只记警告，绝不影响业务（不 inject、不当前置依赖）。
# 保留期默认 180 天，每日分批清理；时间线：/api/admin/audit 与 /admin/audit。
# adminPlugins 是**读**白名单（默认拒绝）；写（record）不设限——限制读才是关键。
- id: audit
  name: '@dizzyapi/plugin-audit'
  config:
    dataPath: ./data/audit.db
    retentionDays: 180
    adminPlugins:
      - '@dizzyapi/plugin-admin'
      - '@dizzyapi/plugin-api'
      - '@dizzyapi/plugin-web'
      # 运维总览要读「最近 24 小时按动作分组 + 最近几条」与总量。
      - '@dizzyapi/plugin-observability'

# 运维总览：**纯只读聚合**，不落盘、不发事件、不挂 HTTP、无定时器。
# 把用量链路（usage.status + 桥命令 usage.stats）、结算汇总（billing.summary）、
# 额度快照（quota.status）、账号运行时（accounts.status 的 runtime）、审计（audit.list/stats）、
# 账号池健康（accountAdmin.list + accountHealth.status）拼成一屏；
# 每块自带数据源健康度（ok / degraded / unavailable + 原因），缺谁只降级那一块。
# 不 inject 任何服务：全部运行期解析，缺服务不影响入口（D5）。
# adminPlugins：本插件名必须登记在 billing / audit 的读白名单里（它以自己的身份读汇总）。
- id: observability
  name: '@dizzyapi/plugin-observability'
  config:
    # 审计窗口一次最多扫多少条（1..1000）；超出时报告标 windowTruncated。
    auditWindowLimit: 200

# 内容审核插件：管理员维护关键词规则的**唯一写者**（服务名 contentAudit，存储 data/content-audit.json）。
# 规则心跳式推给 Go 的 pre 相位审核闸门（桥命令 contentaudit.replace，内容没变也推，
# 否则 Go 侧按 TTL 判定过期——额度闸门踩过这个坑）；命中统计从 Go 读回（contentaudit.status）。
# 只做**大小写不敏感子串匹配**，本批不做正则（ReDoS）。
# enabled 默认 false：新装的插件不该突然拦人；关掉后仍推 enabled:false + 空规则让 Go 立刻全放行。
# adminPlugins 是读写白名单（默认拒绝），api / web 以自己的 actor 身份调。
- id: content-audit
  name: '@dizzyapi/plugin-content-audit'
  config:
    dataPath: ./data/content-audit.json
    enabled: false
    pushIntervalMs: 5000
    adminPlugins:
      - '@dizzyapi/plugin-admin'
      - '@dizzyapi/plugin-api'
      - '@dizzyapi/plugin-web'

# 闸门快照推送（服务名 gateFeed）：把「价格表」与「每个 API key 的累计消费」
# **心跳式**推给 Go 的两条 pre 相位闸门（桥命令 pricing.replace / keyspend.replace；
# 内容不变也推、generation 递增——Go 侧按 TTL 判新鲜度，「没变就跳过」会让闸门在
# TTL 一到按 fail-closed 全 503，这是额度闸门 2026-10-29 踩过的坑）。
# 它自己不存数据：价格是 pricing 的、key 是 api-key 的、用量是 usage 的；
# apiKey / usage 在运行期解析（被禁用时只少一份快照），只有 pricing + 桥 + timer 是 inject。
# pollIntervalMs 要与 Go 侧 -pricing-snapshot-ttl-ms / -keyspend-snapshot-ttl-ms 对齐
# （TTL 建议 ≥ 3 × 本值）。
- id: gate-feed
  name: '@dizzyapi/plugin-gate-feed'
  config:
    enabled: true
    pollIntervalMs: 5000       # 5 秒一轮心跳
    debounceMs: 1000           # 价格 / key 变更后最多等 1 秒再推

# 开发者控制面板：看插件与服务的依赖图、看运行期概览、改设置、重启单个插件、退出整个进程。
# 只绑 127.0.0.1；启动日志里会打印一条带一次性 token 的地址，打开后换成 HttpOnly cookie。
# 必须排在 settings 之后——它要在运行期解析 settings 服务（但不 inject 它，
# 否则改任何配置导致的设置插件重载都会把面板一起抖一下）。
- id: admin
  name: '@dizzyapi/plugin-admin'
  config:
    port: 7788

